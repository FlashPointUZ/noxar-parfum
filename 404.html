<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOXAR PARFUM — Sahifa topilmadi</title>
  <style>
    :root{--black:#0d0d0d;--gold:#c9a35b;--gold-light:#e4c27a;--cream:#f5f1e8;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);color:var(--cream);font-family:var(--sans);text-align:center}
    .container{max-width:420px;padding:40px}
    .brand-mark{font-family:var(--serif);font-size:64px;color:var(--gold);margin-bottom:24px}
    h1{font-family:var(--serif);font-size:42px;font-weight:500;margin:0 0 16px;letter-spacing:-2px}
    h1 i{color:var(--gold-light)}
    p{color:#9c958d;line-height:1.7;margin:0 0 32px;font-size:14px}
    .button{display:inline-flex;align-items:center;gap:20px;padding:16px 24px;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:var(--black);border:0;text-decoration:none;font-family:var(--sans);cursor:pointer;transition:.3s}
    .button:hover{background:var(--gold-light);transform:translateY(-2px)}
    .button span{font-size:18px}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="brand-mark">N</div>
    <h1>Sahifa <i>topilmadi</i></h1>
    <p>Siz qidirayotgan sahifa mavjud emas yoki ko'chirilgan bo'lishi mumkin. Bosh sahifaga qaytib, do'konimizni ko'ring.</p>
    <a class="button" href="/">Bosh sahifaga qaytish <span>↗</span></a>
  </div>
</body>
</html>
